server:
  port: 5000

spring:
  application:
    name: ollim-api
  config:
    import: optional:file:${ENV_FILE:.env.local}[.properties]

  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    rest:
      base-path: /test
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE}
    mongodb:
      host: ${MONGO_HOST}
      port: ${MONGO_PORT}
      username: ${MONGO_USERNAME}
      password: ${MONGO_PASSWORD}
      database: ${MONGO_DATABASE}
      authentication-database: ${AUTHENTICATION_DATABASE}

  security:
    oauth2:
      client:
        registration:
          google:
            provider: google
            client-name: Google
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${BASE_URL}/login/oauth2/code/google
            scope:
              - openid
              - email
              - profile
            authorization-grant-type: authorization_code
          apple:
            provider: apple
            client-name: Apple
            client-id: ${APPLE_CLIENT_ID}
            client-secret: ${APPLE_CLIENT_SECRET}
            redirect-uri: ${BASE_URL}/login/oauth2/code/apple
            scope:
              - openid
              - email
              - name
            authorization-grant-type: authorization_code
            client-authentication-method: "client_secret_post"
        provider:
          apple:
            authorization-uri: https://appleid.apple.com/auth/authorize?response_mode=form_post
            token-uri: https://appleid.apple.com/auth/token
            jwk-set-uri: https://appleid.apple.com/auth/keys
            user-name-attribute: sub
oauth:
  apple:
    client-id: ${APPLE_CLIENT_ID}
    team-id: ${APPLE_TEAM_ID}
    key-id: ${APPLE_KEY_ID}
    secret-key: ${APPLE_PRIVATE_KEY}

jasypt:
  encryptor:
    password: ${JASYPT_ENCRYPTOR_PASSWORD}


springdoc:
  swagger-ui:
    path: /ollim-api
    operations-sorter: method
    display-request-duration: true
    persist-authorization: true
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json

swagger:
  servers:
    local: ${SWAGGER_SERVER_PROD}
    prod: ${SWAGGER_SERVER_NGROK}
    ngrok: ${SWAGGER_SERVER_LOCAL}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active:default}
  observations:
    key-values:
      application: ${spring.application.name}

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${spring.profiles.active:default}
  send-default-pii: true
  traces-sample-rate: 1.0

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRED}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRED}

logging:
  level:
    com.millo.ollim.auth: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
