server:
  port: 5000

spring:
  application:
    name: ollim-api

  config:
    import: optional:file:.env.local[.properties]

  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    rest:
      base-path: /api

    mongodb:
      host: ${MONGO_HOST}
      port: ${MONGO_PORT}
      username: ${MONGO_USERNAME}
      password: ${MONGO_PASSWORD}
      database: ${MONGO_DATABASE}
      authentication-database: ${AUTHENTICATION_DATABASE}

jasypt:
  encryptor:
    password: ${JASYPT_ENCRYPTOR_PASSWORD}

database:
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    password: ${REDIS_PASSWORD}
    database: ${REDIS_DATABASE}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: method
    oauth:
      client-id: ENC(WYlgpuOiGMJ1O2UUBxiQTmU4n50-jYSGOy7az1c262+yyPsDcDD1wr+cjxLq+NEGBpHyiXOsAbDf3I110CMPPlvry3zn29kk13xqpeyRpVd6wfBoNaIrEspCaERnp8eteNb5Q3CMqlMXe/vsZgAxuBg==)
      client-secret: ENC(77K6sNM0WzQeON7VggZXZaQ+oocL3N+HjjT1hPxXmIPeePkcNpXY8kjv2WmnMVCYznMBMxpZ34hSWHxp+sYKSOtkHQNl8hTTgkTq3KmmQnE=)
      use-basic-authentication-with-access-code-grant: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active:default}
  observations:
    key-values:
      application: ${spring.application.name}

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${spring.profiles.active:default}
  send-default-pii: true
  traces-sample-rate: 1.0

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRED}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRED}

oauth:
  google:
    client-id: ${CLIENT_ID}
    client-secret: ${CLIENT_SECRET}
    redirect-uri: ${REDIRECT_URI}
    token-url: https://oauth2.googleapis.com/token
    user-info-url: https://www.googleapis.com/oauth2/v2/userinfo
