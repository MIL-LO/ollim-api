name: CI with Gradle

on:
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      # PostgreSQL 컨테이너 실행
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    # .env 파일 누락 시를 대비해 기본값 설정 (선택 사항)
    env:
      POSTGRES_URL: jdbc:postgresql://localhost:5432/testdb
      POSTGRES_USERNAME: testuser
      POSTGRES_PASSWORD: testpass

    steps:
      # GitHub 리포지토리 checkout
      - uses: actions/checkout@v4

      # JDK 17 설정 (Corretto 사용)
      - name: Set up JDK 17 with Corretto
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'gradle'

      # Gradle 설정
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # gradlew 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # .env 파일 생성 및 환경 변수 export
      # 이후 application.yml 등에서 ${}로 참조 가능하게 함
      - name: Load .env and export variables
        shell: bash
        run: |
          echo "${{ secrets.ENV_FILE }}" | base64 --decode > .env
          set -a
          source .env
          set +a

      # admin-api의 application-private.yml 생성
      - name: Create admin-api environment file
        run: |
          mkdir -p admin-api/src/main/resources
          echo "${{ secrets.ADMIN_API_PRIVATE_YML }}" | base64 --decode > admin-api/src/main/resources/application-private.yml

      # app-api의 application-private.yml 생성
      - name: Create app-api environment file
        run: |
          mkdir -p app-api/src/main/resources
          echo "${{ secrets.APP_API_PRIVATE_YML }}" | base64 --decode > app-api/src/main/resources/application-private.yml

      # service-api의 application.yml 생성 (CI 테스트용 설정)
      - name: Create service-api config for CI
        run: |
          mkdir -p service-api/src/main/resources
          echo "${{ secrets.SERVICE_API_YML }}" | base64 --decode > service-api/src/main/resources/application.yml

      # Gradle 빌드 및 테스트 수행
      - name: Build and Test with Gradle
        run: ./gradlew clean build

  # 의존성 그래프 제출 (GitHub security dashboard용)
  dependency-submission:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17 with Corretto for dependency submission
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'gradle'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@417ae3ccd767c252f5661f1ace9f835f9654f2b5