name: CI with Gradle

on:
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      JASYPT_ENCRYPTOR_PASSWORD: ${{ secrets.JASYPT_ENCRYPTOR_PASSWORD }}

    steps:
      # GitHub 리포지토리 checkout
      - uses: actions/checkout@v4

      # JDK 17 설정
      - name: Set up JDK 17 with Corretto
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'gradle'

      # Gradle 설정
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # gradlew 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # .env 파일 decode 후 export. 실패 시 명확한 로그 출력
      - name: Load .env and export variables
        shell: bash
        run: |
          echo "${{ secrets.ENV_FILE }}" | base64 --decode > .env || (echo "❌ .env decode failed!" && exit 1)
          set -a
          source .env || (echo "❌ .env export failed!" && exit 1)
          set +a
      
      # Docker Compose 실행 (PostgreSQL, Redis, Mongo 포함)
      - name: Start Docker Compose Services
        run: |
          docker compose up -d
          echo "⏳ Waiting for services to be ready..."

      # service-api 설정 파일 생성 (.yml 내 sentry.enabled: false 반드시 포함되어야 함)
      - name: Create service-api config
        run: |
          mkdir -p service-api/src/main/resources
          echo "${{ secrets.SERVICE_API_YML }}" | base64 --decode > service-api/src/main/resources/application.yml
          echo "✅ service-api config created"

      # admin-api 설정 파일 생성
      - name: Create admin-api config
        run: |
          mkdir -p admin-api/src/main/resources
          echo "${{ secrets.ADMIN_API_PRIVATE_YML }}" | base64 --decode > admin-api/src/main/resources/application-private.yml

      # app-api 설정 파일 생성
      - name: Create app-api config
        run: |
          mkdir -p app-api/src/main/resources
          echo "${{ secrets.APP_API_PRIVATE_YML }}" | base64 --decode > app-api/src/main/resources/application-private.yml

      # Gradle 빌드 및 테스트 실행
      - name: Build and Test with Gradle
        run: ./gradlew clean build

      # 테스트 실패 시 리포트 업로드
      - name: Upload Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: service-api/build/reports/tests/test

  dependency-submission:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17 with Corretto for dependency submission
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'gradle'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@417ae3ccd767c252f5661f1ace9f835f9654f2b5