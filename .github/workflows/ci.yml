name: CI with Gradle

on:
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      # PostgreSQL 컨테이너 실행 (.env와 동일한 설정으로 일치시킴)
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U millo"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    # .env 변수 누락 시를 대비해 기본값 설정 (.env와 동일하게 일치시킴)
    env:
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      POSTGRES_USERNAME: ${{ secrets.POSTGRES_USERNAME }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}

    steps:
      # GitHub 리포지토리 checkout
      - uses: actions/checkout@v4

      # JDK 17 설정
      - name: Set up JDK 17 with Corretto
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'gradle'

      # Gradle 설정
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # gradlew 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # .env 파일 decode 후 export. 실패 시 명확한 로그 출력
      - name: Load .env and export variables
        shell: bash
        run: |
          echo "${{ secrets.ENV_FILE }}" | base64 --decode > .env || (echo "❌ .env decode failed!" && exit 1)
          set -a
          source .env || (echo "❌ .env export failed!" && exit 1)
          set +a

      # service-api 설정 파일 생성 (.yml 내 sentry.enabled: false 반드시 포함되어야 함)
      - name: Create service-api config
        run: |
          mkdir -p service-api/src/main/resources
          echo "${{ secrets.SERVICE_API_YML }}" | base64 --decode > service-api/src/main/resources/application.yml

      # service-api 설정 파일 생성 (private 프로필용)
      - name: Create service-api private config
        run: |
          mkdir -p service-api/src/main/resources
          echo "${{ secrets.SERVICE_API_PRIVATE_YML }}" | base64 --decode > service-api/src/main/resources/application-private.yml

      # admin-api 설정 파일 생성
      - name: Create admin-api config
        run: |
          mkdir -p admin-api/src/main/resources
          echo "${{ secrets.ADMIN_API_PRIVATE_YML }}" | base64 --decode > admin-api/src/main/resources/application-private.yml

      # app-api 설정 파일 생성
      - name: Create app-api config
        run: |
          mkdir -p app-api/src/main/resources
          echo "${{ secrets.APP_API_PRIVATE_YML }}" | base64 --decode > app-api/src/main/resources/application-private.yml

      # Gradle 빌드 및 테스트 실행
      - name: Build and Test with Gradle
        run: ./gradlew clean build

      # 테스트 실패 시 리포트 업로드
      - name: Upload Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: service-api/build/reports/tests/test

  dependency-submission:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17 with Corretto for dependency submission
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'gradle'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@417ae3ccd767c252f5661f1ace9f835f9654f2b5