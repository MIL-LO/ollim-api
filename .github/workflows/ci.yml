name: CI with Gradle

on:
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 with Corretto
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # admin-api의 application-private.yml 생성
      - name: Create admin-api environment file
        run: |
          mkdir -p admin-api/src/main/resources
          echo "${{ secrets.ADMIN_API_PRIVATE_YML }}" | base64 --decode > admin-api/src/main/resources/application-private.yml

      # app-api의 application-private.yml 생성
      - name: Create app-api environment file
        run: |
          mkdir -p app-api/src/main/resources
          echo "${{ secrets.APP_API_PRIVATE_YML }}" | base64 --decode > app-api/src/main/resources/application-private.yml

      # service-api의 application-test.yml 생성 (CI 전용 설정)
      - name: Create service-api test config
        run: |
          mkdir -p service-api/src/main/resources
          echo "${{ secrets.SERVICE_API_TEST_YML }}" | base64 --decode > service-api/src/main/resources/application-test.yml

      # Gradle Build (Test, Sentry 제외)
      - name: Gradle Build (No Tests, No Sentry)
        run: ./gradlew clean build -x test -x sentryBundleSourcesJava

      # Gradle Test (테스트 프로필로 실행)
      - name: Gradle Test
        run: SPRING_PROFILES_ACTIVE=test ./gradlew test

      # 테스트 리포트 업로드 (실패 시)
      - name: Upload Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: service-api/build/reports/tests/test

  dependency-submission:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17 with Corretto for dependency submission
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'gradle'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@417ae3ccd767c252f5661f1ace9f835f9654f2b5